<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nube English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: estudio de creador. Rail lateral en PC, barra inferior en móvil; columna central de lectura cómoda. */
:root{
  --sky:#EAF1FD; --paper:#FFFFFF; --paper-2:#F3F7FE; --ink:#121A33; --ink-2:#4B5877; --line:#D6E0F1;
  --blue:#2F5BFF; --blue-ink:#FFFFFF; --blue-soft:#DEE6FF; --marker:#FFE066; --on-marker:#1B1A12;
  --fur:#F6E6CC; --fur-2:#E2C291; --fur-line:#9C7A4E; --tongue:#3D3F92;
  --good:#11946A; --good-soft:#DAF4EA; --bad:#D23A4B; --bad-soft:#FCE3E6; --warn:#B86E00; --warn-soft:#FFF1D6;
  --shadow:0 1px 2px rgba(18,26,51,.06),0 8px 24px rgba(18,26,51,.06);
  --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0B1020; --paper:#131A2E; --paper-2:#19223B; --ink:#E8EDFA; --ink-2:#9DABC9; --line:#27324F;
  --blue:#7D9BFF; --blue-ink:#0B1020; --blue-soft:#1D2950; --marker:#FFD84D; --on-marker:#1B1A12;
  --fur:#F1DEC0; --fur-2:#CDA875; --fur-line:#7A5C37; --tongue:#4B4DA8;
  --good:#3ACB93; --good-soft:#0F3328; --bad:#FF6D7A; --bad-soft:#3B1720; --warn:#F2B048; --warn-soft:#3A2A0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky:#0B1020; --paper:#131A2E; --paper-2:#19223B; --ink:#E8EDFA; --ink-2:#9DABC9; --line:#27324F;
  --blue:#7D9BFF; --blue-ink:#0B1020; --blue-soft:#1D2950; --marker:#FFD84D; --on-marker:#1B1A12;
  --fur:#F1DEC0; --fur-2:#CDA875; --fur-line:#7A5C37; --tongue:#4B4DA8;
  --good:#3ACB93; --good-soft:#0F3328; --bad:#FF6D7A; --bad-soft:#3B1720; --warn:#F2B048; --warn-soft:#3A2A0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.45rem,4vw,2rem);font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--blue)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.marker{background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 92%,transparent 92%);color:inherit;padding:0 .1em}
:root[data-theme="dark"] .marker{color:var(--ink)}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
main#view{padding-inline:16px;padding-block:20px 150px;max-width:780px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--ink-2);font-size:.72rem;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--paper)}
  .rail .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .rail .brand b{font-family:var(--f-display);font-size:1.02rem;line-height:1.1}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:11px 12px}
  .rail .foot{margin-top:auto;padding:10px 8px;font-size:.8rem;color:var(--ink-2)}
  .tabbar{display:none}
  main#view{padding-block:32px 120px}
}

/* Superficies */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);padding:10px 18px;font-weight:700;min-height:44px;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--paper-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.small{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.chip svg{width:14px;height:14px;flex:none}
.month svg{width:22px;height:22px;flex:none}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;width:100%;max-width:420px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:700;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* Nube */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(160deg,var(--blue-soft),var(--paper) 70%);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .nube{width:118px;height:118px;flex:none}
.bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:24px;width:14px;height:14px;background:var(--paper);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble .en{font-size:.9rem;color:var(--ink-2);margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
@media (max-width:480px){.hero{grid-template-columns:1fr;justify-items:center;text-align:left}.hero .bubble::before{left:50%;top:-8px;transform:translateX(-50%) rotate(135deg)}.hero .nube{width:104px;height:104px}}
.nube svg{width:100%;height:100%;overflow:visible}
.nube .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.nube .tail{animation:wag 1.4s ease-in-out infinite;transform-origin:78px 80px}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wag{50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){.nube .bob,.nube .tail{animation:none}}
.mini-nube{width:44px;height:44px;flex:none}

/* KPI y progreso */
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.big b{font-size:clamp(2.2rem,8vw,3.4rem)}
.bar{height:10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s ease}
.bar.good>i{background:var(--good)}

/* Misión del día */
.mission{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.mrow:first-child{border-top:0}
.mrow .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--paper-2);border:1px solid var(--line)}
.mrow .ic svg{width:20px;height:20px}
.mrow.done .ic{background:var(--good-soft);border-color:transparent;color:var(--good)}
.mrow.done .t{text-decoration:line-through;text-decoration-color:var(--ink-2)}
.mrow .t{font-weight:700}
.mrow .d{font-size:.85rem;color:var(--ink-2)}
.mrow:hover{background:var(--paper-2)}

/* Ejercicios */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prompt{font-size:1.25rem;font-weight:700;line-height:1.35}
.prompt.xl{font-family:var(--f-display);font-size:clamp(1.3rem,5vw,1.8rem);font-weight:600}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 15px;font-weight:700;min-height:50px;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--blue)}
.opt .k{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.opt[disabled]{cursor:default}
.feedback{border-radius:14px;padding:12px 14px;font-size:.95rem}
.feedback.ok{background:var(--good-soft)}
.feedback.ko{background:var(--bad-soft)}
.feedback.info{background:var(--blue-soft)}
.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;min-height:48px}
textarea.input{min-height:150px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--blue);outline:none}
label.lbl{font-weight:700;font-size:.92rem}
.example{font-style:italic;color:var(--ink-2)}
.tts{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--paper);flex:none}
.tts svg{width:18px;height:18px}
.scramble{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:700}
.word.used{opacity:.3}
.answerline{min-height:54px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px}

/* Tarjeta de vocabulario */
.flash{perspective:1000px;min-height:230px}
.flash .inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.flash .back{transform:rotateY(180deg);background:var(--paper-2)}
@media (prefers-reduced-motion:reduce){.flash .inner{transition:none}}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{border-radius:12px;flex-direction:column;gap:0;padding:8px 4px;font-size:.85rem}
.rate .btn small{font-weight:400;color:var(--ink-2);font-size:.72rem}

/* Lectura / diálogo */
.reading{font-size:1.08rem;line-height:1.75;max-width:65ch;white-space:pre-line}
.dialog{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.line .who{font-family:var(--f-mono);font-weight:500;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-size:.8rem}
.line.b .who{background:var(--marker);color:var(--on-marker)}
.line.hidden-text .txt{filter:blur(6px);user-select:none}

/* Temporizador flotante */
#timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#timerbar .lab{font-size:.82rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
#timerbar .time{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
#timerbar button{border:0;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:700;padding:8px 14px;min-height:38px}
#timerbar .dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
#timerbar.paused .dot{background:var(--warn);animation:none}
@keyframes pulse{50%{opacity:.3}}
@media (min-width:900px){#timerbar{bottom:24px;left:calc(50% + 116px)}}

/* Modal y toast */
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,26,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#modal .sheet{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px;width:100%;max-width:560px;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){#modal{align-items:center}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}

/* Estadísticas */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--paper-2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--blue) 25%,var(--paper));border-color:transparent}
.heat i.l2{background:color-mix(in srgb,var(--blue) 50%,var(--paper));border-color:transparent}
.heat i.l3{background:color-mix(in srgb,var(--blue) 75%,var(--paper));border-color:transparent}
.heat i.l4{background:var(--blue);border-color:transparent}
.heat i.future{opacity:.35}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.badge .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;font-weight:500;background:var(--paper-2);color:var(--ink-2);flex:none}
.badge.got .medal{background:var(--marker);color:var(--on-marker)}
.badge.got{border-color:color-mix(in srgb,var(--marker) 60%,var(--line))}
.skillrow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.skillrow .mono{text-align:right}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.month{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.month.now{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.month.past{background:var(--paper-2)}
.month b{font-size:.92rem;line-height:1.25}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:14px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--good)}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:pulse 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:4px}
.msg.nb{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.corr{border-left:3px solid var(--bad);padding:6px 10px;background:var(--paper-2);border-radius:0 10px 10px 0}
.corr del{color:var(--bad)}
.corr ins{color:var(--good);text-decoration:none;font-weight:700}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
</style>
<div class="app">
  <nav class="rail" id="rail" aria-label="Secciones"></nav>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<div id="timerbar" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="modal" hidden></div>
<script>
"use strict";
/* ===== CONTENIDO A: prueba de nivel + meses 1-3 ===== */
const PLACEMENT = [
  {lv:"A1", q:"She ___ from Spain.", o:["is","are","am","be"], a:0},
  {lv:"A1", q:"I ___ videos every day.", o:["edits","edit","editing","am edit"], a:1},
  {lv:"A1", q:"___ you have a website?", o:["Are","Is","Do","Does"], a:2},
  {lv:"A1", q:"We ___ busy yesterday.", o:["was","were","are","be"], a:1},
  {lv:"A1", q:"How ___ followers do you have?", o:["much","many","long","often"], a:1},
  {lv:"A1", q:"This is ___ new client.", o:["we","us","our","ours"], a:2},
  {lv:"A2", q:"Right now she ___ a reel.", o:["records","is recording","recorded","record"], a:1},
  {lv:"A2", q:"Last month we ___ 2,000 followers.", o:["gain","gains","gained","have gain"], a:2},
  {lv:"A2", q:"TikTok is ___ than Facebook for young people.", o:["more popular","most popular","popularer","the more popular"], a:0},

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const dkey = (d) => { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dkey(d); };

const fmtHM = sec => { sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return h ? `${h} h ${pad(m)} min` : `${m} min`; };
const fmtClock = sec => { sec = Math.floor(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ":" + pad(m) : m) + ":" + pad(s); };

const Store = {
  db:null, uid:null, online:false, timers:{}, writing:{}, dirty:{},
  async init() {
    DOCS.forEach(d => { const v = LS.get(d); if (v) S[d] = v; });
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      await this.pull(true);
      this.online = true;
    } catch (e) { this.online = false; }
  },
  ref(d) { return this.db.doc(`data/users/${this.uid}/${d}`); },
  async pull(first) {
    if (!this.db) return false;
    let changed = false;
    for (const d of DOCS) {
      if (this.timers[d] || this.writing[d]) continue;
      try {
        const snap = await this.ref(d).get();
        if (snap.exists) {
          const remote = snap.data();
          if (!S[d] || (remote.updatedAt || 0) > (S[d].updatedAt || 0)) { S[d] = clone(remote); LS.set(d, S[d]); changed = true; }
          else if ((S[d].updatedAt || 0) > (remote.updatedAt || 0)) this.queue(d);
        } else if (first && S[d] && S[d].updatedAt) this.queue(d);
      } catch (e) {}
    }
    return changed;
  },
  save(d) { if (!S[d]) return; S[d].updatedAt = Date.now(); LS.set(d, S[d]); this.queue(d); },
  queue(d) {
    if (!this.db) return;

  },
  async write(d) {
    if (this.writing[d]) { this.dirty[d] = true; return; }
    this.writing[d] = true;
    try { await this.ref(d).set(clone(S[d])); this.online = true; }
    catch (e) { if (e && e.code === "unavailable") { setTimeout(() => this.queue(d), 3000 + Math.random() * 2000); } else if (e && (e.code === "revoked" || e.code === "not_granted")) { this.online = false; this.db = null; } }

const Timer = {
  a:null, iv:null, last:0, lastInput:Date.now(),
  start(block, label, skill, idleMin) {
    if (this.a && this.a.block === block) { if (this.a.paused) this.resume(); return; }
    this.stop();
    this.a = {block, label, skill: skill || "vocab", sec:0, pending:0, paused:false, idle:(idleMin || 8) * 60000};
    this.last = Date.now(); this.lastInput = Date.now();
    clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 1000);
    renderTimer();
  },
  tick() {
    const a = this.a; if (!a || a.paused) return;
    const now = Date.now(); let dt = (now - this.last) / 1000; this.last = now;
    if (dt > 5 || document.hidden) dt = 0;
    a.sec += dt; a.pending += dt;
    if (now - this.lastInput > a.idle) { this.pause(); toast("He pausado el cronómetro porque no te veía. Dale a seguir cuando vuelvas."); }
    if (Math.floor(a.sec) % 15 === 0) LS.set("pending", {sec: a.pending, skill: a.skill, day: today()});
    renderTimer();
  },
  commit() {
    const a = this.a; if (!a || a.pending < 1) return;
    const s = a.pending; a.pending = 0;
    S.prog.totalSec += s; dayRec().sec += s;
    S.prog.bySkill[a.skill] = (S.prog.bySkill[a.skill] || 0) + s;
    LS.del("pending"); Store.save("prog"); addXP(Math.round(s / 3)); // 20 seguidores por minuto
  },
  pause() { if (!this.a || this.a.paused) return; this.commit(); this.a.paused = true; renderTimer(); },
  resume() { if (!this.a) return; this.a.paused = false; this.last = Date.now(); this.lastInput = Date.now(); renderTimer(); },
  stop() { if (!this.a) return; this.commit(); this.a = null; clearInterval(this.iv); renderTimer(); }
};

function openModal(html, mount) {

function celebrate(title, text, mood) {
  openModal(`<div class="row" style="justify-content:center"><div class="nube" style="width:140px;height:140px">${nubeSVG(mood || "celebrate")}</div></div>

    <button class="btn primary block" data-close>¡Seguimos!</button>`);

}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"); const W = c.width = innerWidth, H = c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--blue","--marker","--good","--fur-2"].map(v => cs.getPropertyValue(v).trim() || "#2F5BFF");
  const P = Array.from({length: 120}, () => ({x: W / 2, y: H * 0.35, vx: (Math.random() - .5) * 12, vy: Math.random() * -12 - 4, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6}));
  let f = 0; (function loop() { x.clearRect(0, 0, W, H); P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); x.restore(); }); if (++f < 140) requestAnimationFrame(loop); else c.remove(); })();
}

/* ---------- Bloques del día ---------- */
function startBlock(block) { go("act", {type: block, block}); }
function finishBlock(block, xp) {
  const r = dayRec(); let fresh = false;
  if (block && !r.done.includes(block)) { r.done.push(block); fresh = true; }
  Store.save("prog");
  if (fresh) addXP(xp || 100);
  if (Timer.a) Timer.stop();
  const plan = PLANS[r.mode || S.profile.mode] || PLANS["2h"];
  const allDone = plan.every(p => r.done.includes(p[0]));
  if (fresh && allDone && !r.complete) {
    r.complete = true; Store.save("prog"); addXP(300);
    go("hoy");
    celebrate("¡Misión del día completada!", `Hoy llevas ${fmtHM(r.sec)}. Mañana más y mejor. Racha: ${streak()} días.`);
    return;
  }
  if (fresh) toast("Bloque completado · +" + (xp || 100) + " seguidores");
  go("hoy");
}

}

/* ===== MOTOR DE EJERCICIOS (test, escribir, ordenar) ===== */
function runQuiz(el, cfg) {
  const items = cfg.items.slice(); let i = 0; const res = [];
  el.innerHTML = (cfg.headHtml != null ? cfg.headHtml : head(esc(cfg.title), cfg.sub)) + `<div class="card stack" id="qbox"></div>`;
  const qb = $("#qbox", el);
  const fb = cfg.feedback !== false;
  function show() {
    if (i >= items.length) return finish();
    const it = items[i];
    qb.innerHTML = `<div class="qhead"><span class="eyebrow">${i + 1} / ${items.length}</span>${it.tag ? `<span class="chip">${esc(it.tag)}</span>` : ""}</div>
      <div class="bar"><i style="width:${i / items.length * 100}%"></i></div>
      ${it.pre || ""}
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><p class="prompt ${it.xl ? "xl" : ""}" style="flex:1;min-width:0">${it.html || esc(it.prompt)}</p>${it.say ? ttsBtn(it.say, "Escuchar") : ""}</div>
      ${it.hint ? `<p class="small muted">${esc(it.hint)}</p>` : ""}
      <div id="qin"></div><div id="qfb"></div><div class="row" id="qact"></div>`;
    if (it.autoplay && it.say) setTimeout(() => TTS.speak(it.say), 250);
    const qin = $("#qin", qb);
    if (it.type === "mc") {
      const order = it.keep ? it.options.map((_, k) => k) : shuffle(it.options.map((_, k) => k));
      qin.innerHTML = `<div class="opts">${order.map((k, n) => `<button class="opt" data-k="${k}"><span class="k">${n + 1}</span><span>${esc(it.options[k])}</span></button>`).join("")}</div>`;
      $$(".opt", qin).forEach(b => b.onclick = () => answerMC(+b.dataset.k));
    } else if (it.type === "type") {
      qin.innerHTML = `<input class="input" id="qtyped" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(it.placeholder || "Escribe tu respuesta")}">`;
      $("#qact", qb).innerHTML = `<button class="btn primary" id="qcheck">Comprobar</button><button class="btn ghost" id="qskip">No lo sé</button>`;
      const inp = $("#qtyped", qb); inp.focus();
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#qcheck", qb) && $("#qcheck", qb).click(); } };
      $("#qcheck", qb).onclick = () => answerTyped(inp.value);
      $("#qskip", qb).onclick = () => answerTyped("");
    } else if (it.type === "scramble") {
      const words = it.answer.replace(/[.!?]$/, "").split(" ");
      let pool = shuffle(words.map((w, k) => ({w, k}))); if (pool.map(p => p.w).join(" ") === words.join(" ")) pool = pool.reverse();
      const picked = [];
      const draw = () => {
        qin.innerHTML = `<div class="answerline" aria-label="Tu frase">${picked.map((p, n) => `<button class="word" data-rm="${n}">${esc(p.w)}</button>`).join("")}</div>
        <div class="scramble" style="margin-top:10px">${pool.map(p => `<button class="word ${picked.includes(p) ? "used" : ""}" data-add="${p.k}" ${picked.includes(p) ? "disabled" : ""}>${esc(p.w)}</button>`).join("")}</div>`;
        $$("[data-add]", qin).forEach(b => b.onclick = () => { picked.push(pool.find(p => p.k === +b.dataset.add)); draw(); });
        $$("[data-rm]", qin).forEach(b => b.onclick = () => { picked.splice(+b.dataset.rm, 1); draw(); });
      };
      draw();
      $("#qact", qb).innerHTML = `<button class="btn primary" id="qcheck">Comprobar</button>`;
      $("#qcheck", qb).onclick = () => { const g = picked.map(p => p.w).join(" "); answerTyped(g, true); };
    }
  }
  function lockOpts() { $$(".opt", qb).forEach(b => b.disabled = true); }
  function answerMC(k) {
    const it = items[i]; const ok = k === it.answer;
    lockOpts();
    if (fb) { $$(".opt", qb).forEach(b => { const kk = +b.dataset.k; if (kk === it.answer) b.classList.add("ok"); else if (kk === k) b.classList.add("ko"); }); }
    record(ok, it.options[k], it.options[it.answer]);
  }
  function answerTyped(given, exact) {
    const it = items[i]; const st = exact ? (norm(given) === norm(it.answer) ? "ok" : "ko") : checkTyped(given, it.answer);
    const inp = $("#qtyped", qb); if (inp) inp.disabled = true;
    record(st !== "ko", given || "—", [].concat(it.answer)[0], st === "almost");
  }
  function record(ok, given, correct, almost) {
    const it = items[i];
    res.push({ok, given, correct, it});
    if (ok && cfg.xpPer !== 0) addXP(cfg.xpPer || 5);
    if (!ok && cfg.notebook !== false) addError({type: cfg.errType || "Ejercicio", q: it.q || it.prompt, wrong: String(given), right: String(correct), note: it.explain || ""});
    if (cfg.onAnswer) cfg.onAnswer(ok, it);
    if (!fb) { i++; return show(); }
    $("#qfb", qb).innerHTML = `<div class="feedback ${ok ? "ok" : "ko"}"><b>${ok ? (almost ? "¡Casi perfecto! Fíjate en la ortografía." : pickOne(["¡Bien!","¡Eso es!","Perfect!","Nailed it!","¡Correcto!"])) : "No pasa nada, va al cuaderno de errores."}</b>
      ${!ok || almost ? `<br>Respuesta correcta: <b>${esc(correct)}</b>` : ""}${it.explain ? `<br><span class="small">${esc(it.explain)}</span>` : ""}${it.after ? `<br><span class="small example">${esc(it.after)}</span>` : ""}</div>`;
    $("#qact", qb).innerHTML = `<button class="btn primary" id="qnext">${i + 1 < items.length ? "Siguiente" : "Ver resultado"}</button>${it.afterSay ? ttsBtn(it.afterSay) : ""}`;
    const nb = $("#qnext", qb); nb.focus(); nb.onclick = () => { i++; show(); };
  }
  function finish() {
    if (cfg.onDone) return cfg.onDone(res, qb);
    qb.innerHTML = quizResult(res) + `<div class="row" id="qend"></div>`;
    const end = $("#qend", qb);
    if (cfg.onFinish) { end.innerHTML = `<button class="btn primary" id="qfin">${esc(cfg.finishLabel || "Terminar bloque")}</button><button class="btn" id="qagain">Repetir</button>`; $("#qfin", qb).onclick = () => cfg.onFinish(res); $("#qagain", qb).onclick = () => runQuiz(el, Object.assign({}, cfg, {items: shuffle(cfg.items)})); }
  }
  document.onkeydown = e => { if (!document.body.contains(qb)) { document.onkeydown = null; return; } if (/^[1-4]$/.test(e.key) && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { const b = $$(".opt", qb)[+e.key - 1]; if (b && !b.disabled) b.click(); } };
  show();
}
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function quizResult(res) {
  const ok = res.filter(r => r.ok).length, pct = res.length ? Math.round(ok / res.length * 100) : 0;
  const mood = pct >= 90 ? "celebrate" : pct >= 60 ? "proud" : pct >= 40 ? "happy" : "think";
  const miss = res.filter(r => !r.ok);
  return `<div class="hero" style="background:none;border:0;padding:0"><div class="nube">${nubeSVG(mood)}</div><div class="stack" style="gap:4px"><div class="score">${ok}/${res.length}</div>
    <p>${pct >= 90 ? "¡Brutal! Así se hace." : pct >= 60 ? "Muy bien. Vas por buen camino." : pct >= 40 ? "Bien. Repasa los fallos y verás cómo mejora." : "Hoy ha costado. Los errores ya están en tu cuaderno para repasarlos."}</p></div></div>
    ${missList(res)}`;
}
function missList(res) {
  const miss = res.filter(r => !r.ok);
  return miss.length ? `<div class="stack"><span class="eyebrow">Para repasar</span><div class="list">${miss.map(r => `<div class="li"><div class="main"><b>${esc(r.it.q || r.it.prompt)}</b><br><span class="small"><span style="color:var(--bad)">${esc(r.given)}</span> → <b style="color:var(--good)">${esc(r.correct)}</b></span></div></div>`).join("")}</div></div>` : "";
}

/* ---------- Generadores de preguntas a partir del vocabulario ---------- */
function blankSentence(item) {
  const ex = item.ex || ""; const base = item.en.replace(/\(.*?\)/g, "").replace(/^(to|a|an|the) /i, "").replace(/['"…]/g, "").split("/")[0].trim();
  const words = base.split(" ");
  const re = new RegExp("\\b" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").slice(0, Math.max(3, w.length - 2))).join("\\w*\\s+") + "\\w*", "i");
  const m = ex.match(re);
  if (!m) return null;
  return {sentence: ex.replace(m[0], "_____"), answer: m[0]};
}
function vocabMC(item, dir, pool) {
  const others = pick(pool.filter(x => x.id !== item.id && x.en !== item.en), 3);
  if (dir === "en-es") return {type:"mc", tag:"EN → ES", prompt:item.en, say:item.en, options:[item.es].concat(others.map(o => o.es)), answer:0, q:`${item.en} = ?`, after:item.ex};
  return {type:"mc", tag:"ES → EN", prompt:item.es, options:[item.en].concat(others.map(o => o.en)), answer:0, q:`${item.es} = ?`, after:item.ex, afterSay:item.en};
}
function vocabType(item) { return {type:"type", tag:"Escribe en inglés", prompt:item.es, answer:item.en, q:`${item.es} → inglés`, after:item.ex, afterSay:item.en, placeholder:"En inglés…"}; }
function gapItem(item, pool) {
  const b = blankSentence(item); if (!b) return null;
  const others = pick(pool.filter(x => x.id !== item.id), 3).map(o => { const bb = blankSentence(o); return bb ? bb.answer : o.en.replace(/^(to|a|an|the) /i, ""); });
  const opts = [b.answer].concat(others).filter((v, k, a) => a.findIndex(z => norm(z) === norm(v)) === k);
  if (opts.length < 3) return null;
  return {type:"mc", tag:"Completa", prompt:b.sentence, options:opts, answer:0, q:b.sentence, after:item.es, afterSay:item.ex};
}
function scrambleItem(item) { const ex = (item.ex || "").trim(); const n = ex.split(" ").length; if (n < 4 || n > 13) return null; return {type:"scramble", tag:"Ordena la frase", prompt:item.es, hint:"Toca las palabras en orden", answer:ex, q:`Ordena: ${ex}`, afterSay:ex}; }
function grammarItems(m, n) { return m.grammar.quiz.map(q => ({type:"mc", tag:"Gramática", prompt:q[0], options:q[1], answer:q[2], explain:q[3], q:q[0]})).slice(0, n || 99); }

/* ---------- Pantalla Hoy ---------- */
function nubeContext() {
  const h = new Date().getHours(), r = dayRec(), st = streak();
  const mode = r.mode || S.profile.mode, plan = PLANS[mode], target = plan.reduce((s, p) => s + p[1], 0) * 60;

async function makePack() {
  if (packBusy) return; packBusy = true; renderPackCard();
  const m = curMonth();
  const known = seenIds().slice(-150).map(id => ITEMS[id].en).join(", ");
  const prompt = `You are creating daily English study material for David, an 18-year-old Spanish (Spain) video editor who runs a small social media marketing agency. Level: ${S.profile.level}, currently month ${m.n} of a 12-month plan. Month topic: "${m.title}" (${m.es}). Grammar focus: ${m.grammar.title}.
Use natural, native, modern English used by marketers, creators and entrepreneurs. Spanish translations must be Spain Spanish.
Avoid these already-known items: ${known || "none"}.
Reply with ONLY a JSON object with this exact shape:
{"words":[{"en":"word or short expression","es":"traducción","ex":"natural example sentence about marketing/social media"}],
 "reading":{"title":"short title","text":"130-170 word text about the month topic, at the right level","qs":[{"q":"question","o":["option","option","option"],"a":0}]},
 "dictation":["sentence"],
 "grammar":[{"q":"sentence with ___ for the gap","o":["option","option","option"],"a":0,"why":"explicación breve en español de España"}],
 "phrase":{"en":"one native idiom or expression","es":"significado"}}
Exactly 6 words, 3 reading questions, 5 dictation sentences (8-14 words each), 5 grammar questions on the month's grammar. Vary the position of the correct answer.`;
  try {
    const d = await AI.json(prompt, {modelTier: "default"});
    if (!d || !Array.isArray(d.words) || !d.reading || !Array.isArray(d.reading.qs)) throw {code: "invalid_json"};
    d.words = d.words.filter(w => w && w.en && w.es).slice(0, 8);
    d.dictation = (d.dictation || []).filter(Boolean).slice(0, 6);
    d.grammar = (d.grammar || []).filter(q => q && q.q && Array.isArray(q.o) && q.o[q.a] != null).slice(0, 6);
    S.pack = {date: today(), data: d, updatedAt: 0}; Store.save("pack");
    toast("Pack de hoy listo");
  } catch (e) { toast(AI.msg(e), 4500); }
  packBusy = false;
}

ACT.practice = (el, p) => {

/* Listening */
function playDialog(lines, onLine, rate) {
  let stop = false; const run = async () => { for (let k = 0; k < lines.length; k++) { if (stop) break; onLine && onLine(k); await TTS.speak(lines[k][1], {queue:true, rate, voice: lines[k][0] === "A" ? 0 : 1, pitch: lines[k][0] === "A" ? 1 : 0.9}); } onLine && onLine(-1); };
  TTS.stop(); run(); return () => { stop = true; TTS.stop(); };
}
ACT.listening = (el, p) => {
  const m = p.month ? MONTHS[p.month - 1] : curMonth();
  const di = Math.max(0, dayIndex());
  const L = p.month ? m.listening : MONTHS[di % 3 === 0 || monthIdx() === 0 ? monthIdx() : (monthIdx() - (di % 2))].listening;
  beginAct(p, "Listening", "listening");
  let reveal = false, stopFn = null;
  function drawDialog() {
    el.innerHTML = head(esc(L.title), "Listening · escucha sin leer primero") + `
      <div class="card stack">
        <div class="row"><button class="btn primary" id="lplay">${icon("play")} Escuchar el diálogo</button><button class="btn" id="lslow">Más despacio</button><button class="btn ghost" id="lshow">${reveal ? "Ocultar texto" : "Mostrar texto"}</button></div>
        <div class="dialog">${L.lines.map((l, k) => `<div class="line ${l[0] === "B" ? "b" : ""} ${reveal ? "" : "hidden-text"}" data-ln="${k}"><span class="who">${l[0]}</span><span class="txt">${esc(l[1])}</span></div>`).join("")}</div>
        <p class="small muted">Escúchalo dos veces sin leer. Después responde. Si no lo pillas, ponlo más despacio.</p>
        <button class="btn" id="lq">Responder preguntas</button>
      </div>`;
    const hl = k => $$(".line", el).forEach((x, j) => x.style.opacity = k < 0 || j === k ? 1 : .45);
    $("#lplay").onclick = () => { stopFn && stopFn(); stopFn = playDialog(L.lines, hl); };
    $("#lslow").onclick = () => { stopFn && stopFn(); stopFn = playDialog(L.lines, hl, 0.72); };
    $("#lshow").onclick = () => { reveal = !reveal; drawDialog(); };
    $("#lq").onclick = () => { stopFn && stopFn(); questions(); };
  }
  function questions() {
    const items = L.qs.map(q => ({type:"mc", tag:"Comprensión", prompt:q.q, options:q.o, answer:q.a, q:q.q}));
    runQuiz(el, {title:L.title, sub:"Preguntas del diálogo", items, errType:"Listening", onDone(res, box) {
      box.innerHTML = quizResult(res) + `<div class="row"><button class="btn primary" id="ldict">Siguiente: dictado</button><button class="btn" id="lagain">Volver a escuchar</button></div>`;
      $("#ldict").onclick = dictation; $("#lagain").onclick = () => { reveal = true; drawDialog(); };
    }});

function nubeIntro() { const m = curMonth(); return `David tiene 18 años, es de España, edita vídeos y lleva una pequeña agencia de marketing en redes sociales con su hermano. Nivel actual aproximado: ${S.profile.level}. Está en el mes ${m.n} de 12 de su plan de inglés para emprendedores: "${m.title}" (${m.es}), gramática: ${m.grammar.title}.`; }

/* Corrección con Claude (writing y speaking) */
async function correctText(task, text, spoken) {
  const prompt = `You are Nube, a friendly English coach. ${nubeIntro()}
${spoken ? "This is a transcript of what David SAID aloud for this speaking task, so focus on natural spoken English." : "Correct this text David WROTE for this writing task."}
Task: "${task}"
Return ONLY a JSON object:
{"score": number from 0 to 10, "level": "CEFR estimate like A2+ or B1", "summary": "2-3 frases en español de España: qué está bien y qué mejorar", "corrections": [{"wrong": "exact fragment from his text", "right": "corrected fragment", "why": "explicación breve en español de España"}], "native": "the whole text rewritten as a native English-speaking marketer would say it, keeping his ideas", "expressions": [{"en": "useful native expression used in the native version", "es": "traducción al español de España"}], "tip": "un consejo concreto en español para la próxima vez"}
Maximum 8 corrections, most important first. 3 to 5 expressions. Be encouraging but honest.
Text:
"""${text.slice(0, 4000)}"""`;
  return AI.json(prompt, {modelTier: "default", cache: false});
}
function renderCorrection(box, r, task, text, done) {
  const corr = (r.corrections || []).filter(c => c && c.wrong && c.right);
  box.innerHTML = `<div class="card stack">
    <div class="spread"><div class="row"><div class="score">${esc(String(r.score != null ? r.score : "–"))}<span class="muted" style="font-size:1.2rem">/10</span></div>${r.level ? `<span class="chip blue">Nivel ${esc(r.level)}</span>` : ""}</div><div class="mini-nube nube" style="width:56px;height:56px">${nubeSVG((r.score || 0) >= 8 ? "celebrate" : (r.score || 0) >= 5 ? "proud" : "think")}</div></div>
    <p>${esc(r.summary || "")}</p>
    ${corr.length ? `<span class="eyebrow">Correcciones</span><div class="stack">${corr.map(c => `<div class="corr"><del>${esc(c.wrong)}</del> → <ins>${esc(c.right)}</ins><br><span class="small muted">${esc(c.why || "")}</span></div>`).join("")}</div>` : `<div class="feedback ok">¡Sin errores importantes! Muy bien.</div>`}
    ${r.native ? `<span class="eyebrow">Así lo diría un nativo</span><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><p class="reading" style="flex:1;min-width:0">${esc(r.native)}</p>${ttsBtn(r.native)}</div>` : ""}
    ${(r.expressions || []).length ? `<span class="eyebrow">Expresiones para tus tarjetas</span><div class="list">${r.expressions.filter(x => x && x.en).map((x, k) => `<div class="li"><div class="main"><b>${esc(x.en)}</b><br><span class="small muted">${esc(x.es || "")}</span></div><button class="btn small" data-addx="${k}">${icon("plus")} Añadir</button></div>`).join("")}</div>` : ""}
    ${r.tip ? `<div class="feedback info"><b>Consejo de Nube:</b> ${esc(r.tip)}</div>` : ""}
    <div class="row" id="wc-act"></div></div>`;
  $$("[data-addx]", box).forEach(b => b.onclick = () => { const x = r.expressions[+b.dataset.addx]; addCustomCard(x.en, x.es, r.native && r.native.includes(x.en) ? r.native.split(/(?<=[.!?])\s+/).find(s => s.includes(x.en)) || "" : ""); b.disabled = true; b.textContent = "Añadida"; });
  corr.slice(0, 8).forEach(c => addError({type: "Writing", q: c.wrong, wrong: c.wrong, right: c.right, note: c.why || ""}));
  S.writes.items.unshift({date: today(), task, text: text.slice(0, 1500), score: r.score, native: (r.native || "").slice(0, 1500), summary: r.summary || ""});
  if (S.writes.items.length > 60) S.writes.items.length = 60; Store.save("writes");
  addXP(Math.round((Number(r.score) || 5) * 15));
  done($("#wc-act", box));
}
function addCustomCard(en, es, ex) {
  const id = "c" + Date.now() + Math.floor(Math.random() * 99);
  S.srs.custom[id] = [en, es || "", ex || "", monthIdx() + 1]; ITEMS[id] = {id, en, es: es || "", ex: ex || "", m: monthIdx() + 1, kind: "custom"};
  introduce(id); S.srs.cards[id].due = addDays(today(), 1); S.srs.cards[id].b = 1; Store.save("srs"); toast("Añadida a tus tarjetas");
}

/* Ficha para casa */
function fichaData() {
  const r = dayRec();
  if (!r.ficha) {
    const fresh = seenIds().filter(id => S.srs.cards[id].first === today());
    const ids = fresh.concat(shuffle(seenIds().filter(id => !fresh.includes(id)))).slice(0, 12);
    const fill = ids.length < 8 ? nextNewIds(8 - ids.length) : [];
    r.ficha = ids.concat(fill); Store.save("prog");
  }
  return r.ficha.map(id => ITEMS[id]).filter(Boolean);
}

/* Cuaderno de errores */
ACT.notebook = (el, p) => {
  beginAct(p, "Cuaderno de errores", "vocab");
  const errs = openErrors().sort((a, b) => (b.times || 1) - (a.times || 1)).slice(0, 15);
  if (!errs.length) { el.innerHTML = head("Cuaderno de errores") + `<div class="hero"><div class="nube">${nubeSVG("celebrate")}</div><div class="bubble"><p>Tu cuaderno está limpio. ¡Ni un error pendiente!</p></div></div>${p.block ? `<button class="btn primary" id="nbf">Terminar bloque</button>` : ""}`; const f = $("#nbf"); if (f) f.onclick = () => finishBlock(p.block); return; }
  const rights = openErrors().map(e => e.right);
  const items = errs.map(e => {
    const short = (e.right || "").length <= 32 && !/Dictado/.test(e.type);
    if (short && e.type !== "Writing") return {type:"type", tag:e.type, prompt:e.q, answer:e.right, explain:e.note, err:e, q:e.q};
    const opts = [e.right].concat(e.wrong && norm(e.wrong) !== norm(e.right) && e.wrong !== "—" && !/no la recordaba/.test(e.wrong) ? [e.wrong] : []).concat(pick(rights.filter(x => norm(x) !== norm(e.right)), 3)).filter((v, k, a) => a.findIndex(z => norm(z) === norm(v)) === k).slice(0, 4);
    return {type:"mc", tag:e.type, prompt:e.q, options:opts, answer:0, explain:e.note, err:e, q:e.q};
  });
  runQuiz(el, {title:"Cuaderno de errores", sub:"Acierta 2 veces y desaparece", items, notebook:false, errType:"Cuaderno",
    onAnswer(ok, it) { const e = it.err; if (ok) { e.good = (e.good || 0) + 1; if (e.good >= 2) e.fixed = true; } else e.good = 0; Store.save("notes"); },
    onFinish: () => p.block ? finishBlock(p.block) : back(), finishLabel: p.block ? "Terminar bloque" : "Volver"});
};

/* Pregúntale a Nube */
ACT.chat = (el, p) => {
  beginAct(p, "Hablando con Nube", "chat", 12);
  const rules = `Eres Nube, un chow chow simpático y paciente que es profesor de inglés. ${nubeIntro()}
Responde SIEMPRE en español de España (vosotros, "vale", "móvil"), breve (máximo 120 palabras), con 1 a 3 ejemplos en inglés natural del mundo de las redes sociales, el marketing y el emprendimiento.
Si David te escribe en inglés, primero corrige sus errores (formato: "error → corrección") y luego responde. Si te pide practicar una conversación, haz tú el otro papel en inglés y corrígele al final. Anima sin exagerar.`;
  const sugg = ["¿Qué diferencia hay entre make y do?","Explícame el present perfect con ejemplos de redes","¿Cómo digo «me renta» en inglés?","Practica conmigo una llamada de ventas","Dame 5 hooks en inglés para un reel","¿Cómo pido una subida de precio a un cliente?"];
  function draw() {
    el.innerHTML = head("Pregúntale a Nube", "Dudas, práctica y conversación") + `
      <div class="card stack"><div class="chat" id="chatlog">
        <div class="msg nb">¡Hola, ${esc(S.profile.name)}! Pregúntame cualquier duda de inglés o pídeme practicar una situación real: una llamada, un email, un pitch… También puedes escribirme en inglés y te corrijo.</div>
        ${CHAT.turns.map(t => `<div class="msg ${t.role === "user" ? "me" : "nb"}">${esc(t.content)}</div>`).join("")}
      </div>
      ${CHAT.turns.length ? "" : `<div class="row">${sugg.map(s => `<button class="chip" data-sg="${esc(s)}">${esc(s)}</button>`).join("")}</div>`}
      ${AI.state === "off" ? `<div class="feedback ko">${esc(AI.msg({code: "off"}))}</div>` : `<div class="row" style="flex-wrap:nowrap"><textarea class="input" id="chatin" placeholder="Escribe tu pregunta…" style="min-height:52px;height:52px"></textarea><button class="btn primary" id="chatsend">Enviar</button></div>`}
      ${CHAT.turns.length ? `<button class="btn ghost small" id="chatclear" style="align-self:flex-start">Empezar conversación nueva</button>` : ""}</div>`;
    $$("[data-sg]", el).forEach(b => b.onclick = () => send(b.dataset.sg));
    const s = $("#chatsend"); if (s) { s.onclick = () => send($("#chatin").value); $("#chatin").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#chatin").value); } }; }
    const c = $("#chatclear"); if (c) c.onclick = () => { CHAT.turns = []; draw(); };
    const log = $("#chatlog"); log.lastElementChild && log.lastElementChild.scrollIntoView({block: "nearest"});
  }
  let ctl = null;
  async function send(q) {
    q = (q || "").trim(); if (!q) return;
    CHAT.turns.push({role: "user", content: q.slice(0, 2000)});
    if (CHAT.turns.length > 20) CHAT.turns = CHAT.turns.slice(-20);
    draw();
    const log = $("#chatlog"); const b = document.createElement("div"); b.className = "msg nb"; b.innerHTML = `<span class="thinking"><i></i><i></i><i></i></span>`; log.appendChild(b); b.scrollIntoView({block: "nearest"});
    ctl = new AbortController();
    try {
      const r = await AI.text([{role: "user", content: rules}].concat(CHAT.turns), {cache: false, signal: ctl.signal, onText: ({text}) => { b.textContent = text; }});
      CHAT.turns.push({role: "assistant", content: r.text}); addXP(10);
    } catch (e) { b.textContent = e.text || AI.msg(e); CHAT.turns.pop(); }
    const s = $("#chatsend"); if (s) $("#chatin").focus();
  }
  draw();
};

/* ===== JUEGOS ===== */
const GAMES = [
  {id:"speed", t:"Contrarreloj", d:"60 segundos. Traduce todas las que puedas.", rec:"aciertos"},
  {id:"match", t:"Empareja", d:"Une cada palabra con su traducción lo más rápido posible.", rec:"seg", low:true},
  {id:"native", t:"¿Nativo o no?", d:"Elige la frase que diría un nativo.", rec:"de 10"},
  {id:"caption", t:"Completa el caption", d:"Rellena el hueco del post como un creador.", rec:"de 8"},
  {id:"ear", t:"Oído fino", d:"Escucha y elige lo que has oído.", rec:"de 8"}
];
function gameRec(id, val) {
  S.prog.games = S.prog.games || {}; const g = GAMES.find(x => x.id === id); const old = S.prog.games[id];
  const better = old == null || (g.low ? val < old : val > old);
  if (better) { S.prog.games[id] = val; Store.save("prog"); }
  return {better: better && old != null, old};
}
VIEWS.juegos = (p, el) => {
  const recs = S.prog.games || {};
  el.innerHTML = `<div class="stack" style="gap:4px"><span class="eyebrow">${p.block ? "Bloque de la misión · elige uno" : "Para ratos muertos · también suman horas"}</span><h1>Juegos</h1></div>

  $$("[data-game]", el).forEach(b => b.onclick = () => go("game", {g: b.dataset.game, block: p.block}));

function gameEnd(el, p, title, big, msg, rec) {
  const g = GAMES.find(x => x.id === p.g);
  el.innerHTML = head(esc(title), "Resultado") + `<div class="card stack" style="align-items:center;text-align:center">
    <div class="nube" style="width:120px;height:120px">${nubeSVG(rec.better ? "celebrate" : "proud")}</div><div class="score">${esc(big)}</div><p>${esc(msg)}</p>
    ${rec.better ? `<span class="chip good">¡Nuevo récord! Antes: ${rec.old} ${g.rec}</span>` : S.prog.games && S.prog.games[p.g] != null ? `<span class="chip">Tu récord: ${S.prog.games[p.g]} ${g.rec}</span>` : ""}
    <div class="row" style="justify-content:center">${p.block ? `<button class="btn primary" id="gfin">Terminar bloque</button>` : ""}<button class="btn ${p.block ? "" : "primary"}" id="gagain">Jugar otra vez</button><button class="btn ghost" id="gother">Otro juego</button></div></div>`;
  if (rec.better) confetti();
  const f = $("#gfin"); if (f) f.onclick = () => finishBlock(p.block);
  $("#gagain").onclick = () => go("game", p);
  $("#gother").onclick = () => { if (Timer.a) Timer.stop(); go("juegos", {block: p.block}); };
}
VIEWS.game = (p, el) => {
  const g = GAMES.find(x => x.id === p.g); if (!g) return go("juegos");
  Timer.start(p.block || "free-game", "Juego: " + g.t, "games");
  ({speed: gSpeed, match: gMatch, native: gNative, caption: gCaption, ear: gEar})[g.id](el, p, g);
};

function gSpeed(el, p, g) {
  const pool = practicePool(20); let t = 60, score = 0, total = 0, cur = null, iv = null;
  el.innerHTML = head(g.t, "60 segundos") + `<div class="card stack"><div class="spread"><div class="score mono" id="st">1:00</div><span class="chip good" id="ss">0 aciertos</span></div><div id="sq"></div></div>`;
  function next() {
    const it = pick(pool, 1)[0]; const others = pick(pool.filter(x => x.id !== it.id && x.es !== it.es), 3);
    const opts = shuffle([it].concat(others)); cur = it;
    $("#sq").innerHTML = `<p class="prompt xl">${esc(it.en)}</p><div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.es)}</button>`).join("")}</div>`;
    $$("#sq .opt").forEach(b => b.onclick = () => {
      total++; const ok = b.dataset.id === cur.id;
      b.classList.add(ok ? "ok" : "ko"); if (ok) { score++; addXP(3); } else addError({type:"Juego", q:`${cur.en} = ?`, wrong: ITEMS[b.dataset.id].es, right: cur.es, note: cur.ex});
      $("#ss").textContent = score + " aciertos"; setTimeout(next, ok ? 180 : 650);
    });
  }
  iv = setInterval(() => { const st = $("#st"); if (!st) return clearInterval(iv); t--; st.textContent = "0:" + pad(Math.max(0, t)); if (t <= 0) { clearInterval(iv); const rec = gameRec("speed", score); gameEnd(el, p, g.t, `${score}`, `aciertos de ${total} intentos en 60 segundos.`, rec); } }, 1000);
  next();
}
function gMatch(el, p, g) {
  const items = pick(practicePool(12), 6); const start = Date.now(); let sel = null, left = items.length, miss = 0;
  const L = shuffle(items), Rr = shuffle(items);
  el.innerHTML = head(g.t, "Toca una palabra y luego su traducción") + `<div class="card stack"><div class="spread"><span class="chip" id="mt">0 s</span><span class="chip" id="mm">0 fallos</span></div>
    <div class="grid2" style="grid-template-columns:1fr 1fr"><div class="opts">${L.map(it => `<button class="opt" data-l="${it.id}">${esc(it.en)}</button>`).join("")}</div><div class="opts">${Rr.map(it => `<button class="opt" data-r="${it.id}">${esc(it.es)}</button>`).join("")}</div></div></div>`;
  const iv = setInterval(() => { const m = $("#mt"); if (!m) return clearInterval(iv); m.textContent = Math.round((Date.now() - start) / 1000) + " s"; }, 500);
  const clear = () => $$("[data-l]").forEach(b => b.style.borderColor = "");
  $$("[data-l]").forEach(b => b.onclick = () => { if (b.disabled) return; clear(); sel = b.dataset.l; b.style.borderColor = "var(--blue)"; TTS.speak(ITEMS[sel].en); });
  $$("[data-r]").forEach(b => b.onclick = () => {
    if (!sel || b.disabled) return;
    const lb = $(`[data-l="${sel}"]`);
    if (b.dataset.r === sel) { b.classList.add("ok"); lb.classList.add("ok"); b.disabled = lb.disabled = true; left--; addXP(3); sel = null; clear();
      if (!left) { clearInterval(iv); const s = Math.round((Date.now() - start) / 1000); const rec = gameRec("match", s); gameEnd(el, p, g.t, `${s} s`, `${miss} fallos. ${s < 25 ? "¡Rapidísimo!" : "Intenta bajar de 25 segundos."}`, rec); } }
    else { miss++; $("#mm").textContent = miss + " fallos"; b.classList.add("ko"); setTimeout(() => b.classList.remove("ko"), 400); }
  });
}
function gNative(el, p, g) {
  const rounds = pick(NATIVE, 10).map(n => ({type:"mc", tag:"¿Cuál diría un nativo?", prompt:"Elige la frase natural", options:[n[1], n[0]], answer:0, explain:n[2], q:`Nativo: ${n[1]}`, afterSay:n[1]}));
  runQuiz(el, {title:g.t, sub:"Elige la frase que suena nativa", items:rounds, errType:"Nativo o no", onDone(res) { const s = res.filter(r => r.ok).length; gameEnd(el, p, g.t, `${s}/10`, s >= 9 ? "Hablas como un nativo." : "Los fallos van a tu cuaderno de errores.", gameRec("native", s)); }});
}
function gCaption(el, p, g) {
  const pool = practicePool(20); const items = [];
  for (const it of shuffle(pool)) { if (items.length >= 8) break; const q = gapItem(it, pool); if (q) items.push(Object.assign(q, {tag:"Caption", html:`<span class="row" style="gap:8px;margin-bottom:6px"><span class="mini-nube nube" style="width:32px;height:32px">${nubeSVG("happy")}</span><span class="small"><b>@nube.english</b> · Patrocinado</span></span>${esc(q.prompt)}`}));
  }
  if (items.length < 3) { el.innerHTML = head(g.t) + `<div class="empty">Aprende unas cuantas palabras nuevas primero y vuelve.</div>`; return; }
  runQuiz(el, {title:g.t, sub:"Rellena el hueco del post", items, errType:"Caption", onDone(res) { const s = res.filter(r => r.ok).length; gameEnd(el, p, g.t, `${s}/${items.length}`, "Así se escriben los captions de verdad.", gameRec("caption", s)); }});
}
function gEar(el, p, g) {
  const pool = practicePool(20); const sel = pick(pool, 8);
  const items = sel.map(it => ({type:"mc", tag:"Escucha", html:"¿Qué has oído?", prompt:"¿Qué has oído?", say:it.en, autoplay:true, options:[it.en].concat(pick(pool.filter(x => x.id !== it.id), 3).map(x => x.en)), answer:0, q:`Oído: ${it.en}`, after:it.es}));
  runQuiz(el, {title:g.t, sub:"Pulsa el altavoz para repetir", items, errType:"Oído fino", onDone(res) { const s = res.filter(r => r.ok).length; gameEnd(el, p, g.t, `${s}/8`, "Tu oído se entrena cada día.", gameRec("ear", s)); }});
}

    rd.onload = () => { try { const j = JSON.parse(rd.result); if (!j.data || !j.data.profile) throw 0;
      openModal(`<h2>¿Importar esta copia?</h2><p class="muted">Copia del ${esc(j.date || "?")}. Sustituirá tu progreso actual en este dispositivo y en tu cuenta.</p><div class="row"><button class="btn primary" id="imp-ok">Sí, importar</button><button class="btn" data-close>Cancelar</button></div>`, sh => {
        $("#imp-ok", sh).onclick = () => { DOCS.forEach(d => { if (j.data[d]) { S[d] = j.data[d]; Store.save(d); } }); registerCustom(); closeModal(); toast("Copia importada"); render(); };
      }); } catch (err) { toast("Ese archivo no es una copia de Nube English."); } };
    rd.readAsText(f);
  };
}
VIEWS.placement = (p, el) => {
  beginAct({type: "placement"}, "Prueba de nivel", "grammar");
  const items = PLACEMENT.map(q => ({type:"mc", prompt:q.q, options:q.o, answer:q.a, lv:q.lv}));
  runQuiz(el, {title:"Prueba de nivel", sub:"Para ver cuánto has avanzado", items, feedback:false, notebook:false, xpPer:0, onDone(res, box) {
    const by = {A1:0, A2:0, B1:0, B2:0}; res.forEach((r, i) => { if (r.ok) by[items[i].lv]++; });
    let lvl = "A1"; for (const l of ["A1","A2","B1","B2"]) { if (by[l] >= 4) lvl = l; else break; }
    const score = res.filter(r => r.ok).length; S.profile.level = lvl; Store.save("profile"); if (Timer.a) Timer.stop();
    box.innerHTML = `<div class="hero"><div class="nube">${nubeSVG("proud")}</div><div class="bubble"><span class="eyebrow">Nivel actual estimado</span><div class="score">${lvl}</div><p>${score} de 24. ${S.profile.placement ? `Empezaste en ${esc(S.profile.placement.level)} con ${S.profile.placement.score}/24.` : ""}</p></div></div><button class="btn primary" id="plb">Volver</button>`;
    $("#plb").onclick = () => go("progreso");
  }});
};

boot();
</script>
